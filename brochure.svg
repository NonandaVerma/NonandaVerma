<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1700" width="100%" height="1700">
  <defs>
    <!-- Master Brochure Background Gradient: Electric Cyan-Blue -->
    <linearGradient id="brochureBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1489CA" />
      <stop offset="50%" stop-color="#127EBA" />
      <stop offset="100%" stop-color="#0E6B9E" />
    </linearGradient>

    <!-- Animated Outer Border Flow Gradient -->
    <linearGradient id="borderFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7704">
        <animate attributeName="stop-color" values="#FF7704;#1489CA;#F6530F;#FF7704" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#FFFFFF">
        <animate attributeName="stop-color" values="#FFFFFF;#FF7704;#1489CA;#FFFFFF" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#1489CA">
        <animate attributeName="stop-color" values="#1489CA;#F6530F;#FF7704;#1489CA" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Card Soft Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.22" />
    </filter>

    <!-- Clip Paths for Cards -->
    <clipPath id="cardClip1"><rect x="35" y="215" width="830" height="425" rx="24" /></clipPath>
    <clipPath id="cardClip2"><rect x="35" y="670" width="830" height="425" rx="24" /></clipPath>
    <clipPath id="cardClip3"><rect x="35" y="1125" width="830" height="425" rx="24" /></clipPath>
    <clipPath id="masterClip"><rect x="0" y="0" width="900" height="1700" rx="24" /></clipPath>
  </defs>

  <style>
    @keyframes titleGlow {
      0%, 100% { filter: drop-shadow(0 4px 12px rgba(1, 0, 19, 0.35)); }
      50% { filter: drop-shadow(0 6px 20px rgba(255, 119, 4, 0.45)); }
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.92; }
      50% { opacity: 1; }
    }
    .main-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #FFFFFF;
      animation: titleGlow 4s ease-in-out infinite;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      fill: #FFFFFF;
      animation: pulseText 3s ease-in-out infinite;
    }
    .btn-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 1.2px;
      fill: #FFFFFF;
    }
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif;
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      fill: #FF7704;
    }
    .body-lead {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14.5px;
      line-height: 1.5;
      font-weight: 500;
      fill: #334155;
    }
    .bullet-bold {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      fill: #0F172A;
    }
    .bullet-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13.5px;
      font-weight: 400;
      fill: #475569;
    }
    .quote-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14.5px;
      font-weight: 600;
      fill: #FFFFFF;
    }
    .quad-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      fill: #0F172A;
    }
    .quad-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12.5px;
      font-style: italic;
      fill: #64748B;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      fill: #FFFFFF;
    }
    .proj-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 800;
      fill: #0F172A;
    }
    .proj-tags {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      fill: #1489CA;
    }
    .proj-desc {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.45;
      fill: #475569;
    }
  </style>

  <g clip-path="url(#masterClip)">
    <!-- 1. FULL BROCHURE BLUE CANVAS -->
    <rect x="0" y="0" width="900" height="1700" fill="url(#brochureBg)" />

    <!-- Animated Outer Border Flow -->
    <rect x="3" y="3" width="894" height="1694" rx="23" fill="none" stroke="url(#borderFlow)" stroke-width="2.5" />

    <!-- ==================================================== -->
    <!-- TOP HEADER: CENTER ALIGNED TYPOGRAPHY & BUTTONS     -->
    <!-- ==================================================== -->
    <g transform="translate(0, 32)">
      <text x="50%" y="42" text-anchor="middle" class="main-title">NONANDA VERMA</text>
      <text x="50%" y="72" text-anchor="middle" class="subtitle">DESIGNER BY EYE. DEVELOPER BY CODE.</text>
      <line x1="220" y1="88" x2="680" y2="88" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.75" />

      <!-- 3 Pill Buttons Centered -->
      <g transform="translate(235, 108)">
        <rect x="0" y="0" width="130" height="38" rx="19" fill="#0A5B9E" stroke="#FFFFFF" stroke-width="1.8" />
        <text x="65" y="24" text-anchor="middle" class="btn-text">LINKEDIN</text>

        <rect x="145" y="0" width="155" height="38" rx="19" fill="#070A12" stroke="#FFFFFF" stroke-width="1.8" />
        <text x="222" y="24" text-anchor="middle" class="btn-text">LET'S CONNECT</text>

        <rect x="315" y="0" width="135" height="38" rx="19" fill="#FF7704" stroke="#FFFFFF" stroke-width="1.8" />
        <text x="382" y="24" text-anchor="middle" class="btn-text">PORTFOLIO</text>
      </g>
    </g>

    <!-- ==================================================== -->
    <!-- CARD 1: THE 30-SECOND DOWNLOAD                       -->
    <!-- ==================================================== -->
    <g clip-path="url(#cardClip1)">
      <rect x="35" y="215" width="830" height="425" rx="24" fill="#FFFFFF" filter="url(#cardShadow)" />

      <!-- Orange Timer Icon & Title -->
      <g transform="translate(75, 245)">
        <g transform="translate(0, 2)" stroke="#FF7704" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="16" cy="18" r="13" />
          <line x1="16" y1="2" x2="16" y2="5" />
          <line x1="12" y1="2" x2="20" y2="2" />
          <line x1="16" y1="18" x2="21" y2="13" />
        </g>
        <text x="44" y="24" class="card-title">THE 30-SECOND DOWNLOAD</text>
      </g>

      <text x="75" y="308" class="body-lead">
        <tspan x="75" dy="0">I engineer resilient full-stack systems, custom cryptographic identity protocols, and autonomous AI agent workflows — then</tspan>
        <tspan x="75" dy="22">wrap them in high-converting, pixel-perfect design systems. Zero boilerplate fluff, zero sloppy layouts.</tspan>
      </text>

      <!-- Bullets -->
      <g transform="translate(75, 364)">
        <circle cx="7" cy="7" r="5" fill="#1489CA" />
        <text x="22" y="11">
          <tspan class="bullet-bold">Architectural Depth: </tspan>
          <tspan class="bullet-desc">From engineering in-house enterprise OAuth2 Identity Providers (IdP) with cryptographic JWT/JWE lifecycles,</tspan>
        </text>
        <text x="22" y="28" class="bullet-desc">to orchestrating local AI agent CLI execution environments with real-time WebSocket pipelines.</text>
      </g>

      <g transform="translate(75, 412)">
        <circle cx="7" cy="7" r="5" fill="#FF7704" />
        <text x="22" y="11">
          <tspan class="bullet-bold">Agentic AI &amp; RAG: </tspan>
          <tspan class="bullet-desc">Creator of ENVI, an autonomous AI portfolio command center featuring 5-tier zero-downtime failover,</tspan>
        </text>
        <text x="22" y="28" class="bullet-desc">Python FastAPI, LangGraph StateGraphs, and ChromaDB 768-dimensional vector retrieval.</text>
      </g>

      <g transform="translate(75, 460)">
        <circle cx="7" cy="7" r="5" fill="#0A5B9E" />
        <text x="22" y="11">
          <tspan class="bullet-bold">Visual Instincts: </tspan>
          <tspan class="bullet-desc">3rd Runner-Up nationwide in the Government of India / MyGov IHRC National Logo Design Competition.</tspan>
        </text>
        <text x="22" y="28" class="bullet-desc">Every layout I ship is disciplined, responsive, and performance-tuned.</text>
      </g>

      <g transform="translate(75, 508)">
        <circle cx="7" cy="7" r="5" fill="#070A12" />
        <text x="22" y="11">
          <tspan class="bullet-bold">Academic Rigor: </tspan>
          <tspan class="bullet-desc">Master of Computer Applications (75% First Class Distinction) &amp; BSc Biotechnology (92% Distinction Honours).</tspan>
        </text>
      </g>

      <!-- Bottom Orange Quote Bar -->
      <g transform="translate(35, 580)">
        <rect x="0" y="0" width="830" height="60" fill="#FF7704" />
        <text x="50%" y="36" text-anchor="middle" class="quote-text" font-style="italic">"Most developers either dread CSS or run away from distributed backend logic. I live comfortably in the middle."</text>
      </g>
    </g>

    <!-- ==================================================== -->
    <!-- CARD 2: PRODUCTION ARCHITECTURE & STACK              -->
    <!-- ==================================================== -->
    <g clip-path="url(#cardClip2)">
      <rect x="35" y="670" width="830" height="425" rx="24" fill="#FFFFFF" filter="url(#cardShadow)" />

      <g transform="translate(75, 700)">
        <g transform="translate(0, 3)" stroke="#FF7704" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </g>
        <text x="44" y="24" class="card-title">PRODUCTION ARCHITECTURE &amp; STACK</text>
      </g>

      <!-- Quad 1 -->
      <g transform="translate(75, 755)">
        <text x="0" y="16" class="quad-title">⚡ Frontend &amp; Edge Delivery</text>
        <text x="0" y="34" class="quad-sub">Pixel-perfect, accessible, 60fps edge rendering</text>
        <g transform="translate(0, 48)">
          <rect x="0" y="0" width="90" height="26" rx="13" fill="#070A12" /><text x="45" y="17" text-anchor="middle" class="badge-text">Next.js 16</text>
          <rect x="96" y="0" width="80" height="26" rx="13" fill="#1489CA" /><text x="136" y="17" text-anchor="middle" class="badge-text">React 19</text>
          <rect x="182" y="0" width="86" height="26" rx="13" fill="#D97706" /><text x="225" y="17" text-anchor="middle" class="badge-text">JavaScript</text>
          <rect x="274" y="0" width="94" height="26" rx="13" fill="#0284C7" /><text x="321" y="17" text-anchor="middle" class="badge-text">Tailwind v4</text>
        </g>
      </g>

      <!-- Quad 2 -->
      <g transform="translate(485, 755)">
        <text x="0" y="16" class="quad-title">⚙️ Backend, Systems &amp; APIs</text>
        <text x="0" y="34" class="quad-sub">Distributed microservices &amp; cryptographic security</text>
        <g transform="translate(0, 48)">
          <rect x="0" y="0" width="114" height="26" rx="13" fill="#059669" /><text x="57" y="17" text-anchor="middle" class="badge-text">Python FastAPI</text>
          <rect x="120" y="0" width="74" height="26" rx="13" fill="#16A34A" /><text x="157" y="17" text-anchor="middle" class="badge-text">Node.js</text>
          <rect x="200" y="0" width="76" height="26" rx="13" fill="#070A12" /><text x="238" y="17" text-anchor="middle" class="badge-text">ColdBox</text>
          <rect x="282" y="0" width="76" height="26" rx="13" fill="#EA580C" /><text x="320" y="17" text-anchor="middle" class="badge-text">OAuth2</text>
        </g>
      </g>

      <!-- Quad 3 -->
      <g transform="translate(75, 885)">
        <text x="0" y="16" class="quad-title">🤖 Agentic AI &amp; Vector Intelligence</text>
        <text x="0" y="34" class="quad-sub">Multi-agent graphs, persistent memory &amp; LLM failover</text>
        <g transform="translate(0, 48)">
          <rect x="0" y="0" width="90" height="26" rx="13" fill="#FF7704" /><text x="45" y="17" text-anchor="middle" class="badge-text">LangGraph</text>
          <rect x="96" y="0" width="90" height="26" rx="13" fill="#DC2626" /><text x="141" y="17" text-anchor="middle" class="badge-text">ChromaDB</text>
          <rect x="192" y="0" width="94" height="26" rx="13" fill="#4D7C0F" /><text x="239" y="17" text-anchor="middle" class="badge-text">NVIDIA NIM</text>
          <rect x="292" y="0" width="66" height="26" rx="13" fill="#070A12" /><text x="325" y="17" text-anchor="middle" class="badge-text">Ollama</text>
        </g>
      </g>

      <!-- Quad 4 -->
      <g transform="translate(485, 885)">
        <text x="0" y="16" class="quad-title">☁️ Cloud, DevOps &amp; UI Systems</text>
        <text x="0" y="34" class="quad-sub">Containers, edge infrastructure &amp; brand design</text>
        <g transform="translate(0, 48)">
          <rect x="0" y="0" width="72" height="26" rx="13" fill="#0284C7" /><text x="36" y="17" text-anchor="middle" class="badge-text">Docker</text>
          <rect x="78" y="0" width="84" height="26" rx="13" fill="#15803D" /><text x="120" y="17" text-anchor="middle" class="badge-text">MongoDB</text>
          <rect x="168" y="0" width="92" height="26" rx="13" fill="#070A12" /><text x="214" y="17" text-anchor="middle" class="badge-text">Vercel Edge</text>
          <rect x="266" y="0" width="92" height="26" rx="13" fill="#0A5B9E" /><text x="312" y="17" text-anchor="middle" class="badge-text">UI Systems</text>
        </g>
      </g>

      <!-- Bottom Blue Callout Bar -->
      <g transform="translate(35, 1035)">
        <rect x="0" y="0" width="830" height="60" fill="#1489CA" />
        <text x="50%" y="36" text-anchor="middle" class="quote-text">Production-hardened architectures paired with pixel-perfect visual discipline.</text>
      </g>
    </g>

    <!-- ==================================================== -->
    <!-- CARD 3: FEATURED ENGINEERING SHOWCASE                -->
    <!-- ==================================================== -->
    <g clip-path="url(#cardClip3)">
      <rect x="35" y="1125" width="830" height="425" rx="24" fill="#FFFFFF" filter="url(#cardShadow)" />

      <g transform="translate(75, 1155)">
        <g transform="translate(0, 3)" stroke="#FF7704" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z"/>
          <path d="M12 15l-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z"/>
        </g>
        <text x="44" y="24" class="card-title">FEATURED ENGINEERING SHOWCASE</text>
      </g>

      <!-- Project 1 -->
      <g transform="translate(75, 1210)">
        <text x="0" y="16" class="proj-title">🚀 Portfolio &amp; ENVI AI Command Center</text>
        <text x="0" y="33" class="proj-tags">NEXT.JS 16 • FASTAPI • LANGGRAPH • CHROMADB</text>
        <text x="0" y="52" class="proj-desc">5-tier zero-downtime LLM failover, 768-dim vector RAG memory,</text>
        <text x="0" y="69" class="proj-desc">and Cloudinary edge asset compression (f_auto, q_auto).</text>
      </g>

      <!-- Project 2 -->
      <g transform="translate(485, 1210)">
        <text x="0" y="16" class="proj-title">🔐 Custom OAuth2 Identity Provider (IdP)</text>
        <text x="0" y="33" class="proj-tags">COLDBOX • JWT / JWE • RSA-256 ROTATION • MSSQL</text>
        <text x="0" y="52" class="proj-desc">RFC 6749 compliant PKCE auth server with automated PEM key</text>
        <text x="0" y="69" class="proj-desc">rotation, eliminating recurring commercial identity SaaS costs.</text>
      </g>

      <!-- Project 3 -->
      <g transform="translate(75, 1340)">
        <text x="0" y="16" class="proj-title">⚡ Agentic SSH Terminal Orchestrator</text>
        <text x="0" y="33" class="proj-tags">NODE.JS • EXPRESS • XTERM.JS • LOCAL OLLAMA</text>
        <text x="0" y="52" class="proj-desc">Sub-10ms bi-directional WebSocket ANSI streaming bridge routing</text>
        <text x="0" y="69" class="proj-desc">autonomous CLI agent workflows with persistent Tmux sessions.</text>
      </g>

      <!-- Project 4 -->
      <g transform="translate(485, 1340)">
        <text x="0" y="16" class="proj-title">📊 Schema-Driven Dynamic Dashboard</text>
        <text x="0" y="33" class="proj-tags">REACT • PLOTLY.JS • RECHARTS • MONGODB ATLAS</text>
        <text x="0" y="52" class="proj-desc">Low-code data analytics engine dynamically transforming raw JSON</text>
        <text x="0" y="69" class="proj-desc">and Mongo schemas into multi-axis charts with zero frontend rebuilds.</text>
      </g>

      <!-- Bottom Dark Callout Bar -->
      <g transform="translate(35, 1490)">
        <rect x="0" y="0" width="830" height="60" fill="#070A12" />
        <text x="50%" y="36" text-anchor="middle" class="quote-text">Engineered for fault-tolerance, sub-second latency, and measurable impact.</text>
      </g>
    </g>

    <!-- ==================================================== -->
    <!-- BOTTOM DYNAMIC WAVE RIBBON FOOTER                    -->
    <!-- ==================================================== -->
    <g transform="translate(0, 1570)">
      <path d="M 0 65 Q 220 115 500 80 T 900 70 L 900 130 L 0 130 Z" fill="#FFFFFF" />
      <path d="M 0 78 Q 260 125 580 85 T 900 90 L 900 130 L 0 130 Z" fill="#070A12" />
      <path d="M 0 92 Q 240 135 560 98 T 900 108 L 900 130 L 0 130 Z" fill="#FF7704" />
    </g>
  </g>
</svg>
