<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-label="Nonanda Verma — Designer by Eye, Developer by Code">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220" />
      <stop offset="45%" stop-color="#0E3A5C" />
      <stop offset="100%" stop-color="#1489CA" />
    </linearGradient>

    <linearGradient id="borderFlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7704">
        <animate attributeName="stop-color" values="#FF7704;#1489CA;#FF7704" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1489CA">
        <animate attributeName="stop-color" values="#1489CA;#FF7704;#1489CA" dur="9s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#FF7704">
        <animate attributeName="stop-color" values="#FF7704;#1489CA;#FF7704" dur="9s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CFEBFF" />
    </linearGradient>

    <radialGradient id="glowOrange" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7704" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FF7704" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1489CA" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1489CA" stop-opacity="0" />
    </radialGradient>

    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30" />
    </filter>

    <clipPath id="masterClip"><rect x="0" y="0" width="1200" height="380" rx="30" /></clipPath>
    <clipPath id="waveClip"><rect x="0" y="340" width="1200" height="40" /></clipPath>
  </defs>

  <style>
    .kicker { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; letter-spacing: 5px; fill: #FF9B4A; }
    .name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 64px; font-weight: 900; letter-spacing: 3px; fill: url(#nameGrad); }
    .tagline { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 600; letter-spacing: 1.5px; fill: #E7F3FF; }
    .keywords { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #9FCBEA; }
    @keyframes drift { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(0, -10px); } }
    .orb-a { animation: drift 7s ease-in-out infinite; }
    .orb-b { animation: drift 9s ease-in-out infinite reverse; }
  </style>

  <g clip-path="url(#masterClip)">
    <rect x="0" y="0" width="1200" height="380" fill="url(#bgGrad)" />

    <circle class="orb-a" cx="140" cy="90" r="160" fill="url(#glowOrange)" filter="url(#softBlur)" />
    <circle class="orb-b" cx="1080" cy="300" r="200" fill="url(#glowBlue)" filter="url(#softBlur)" />

    <rect x="3" y="3" width="1194" height="374" rx="28" fill="none" stroke="url(#borderFlow)" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="6s" repeatCount="indefinite" />
    </rect>

    <g text-anchor="middle">
      <text x="600" y="118" class="kicker">FULL-STACK ARCHITECT · AI SYSTEMS ENGINEER</text>
      <text x="600" y="188" class="name">NONANDA VERMA</text>

      <rect x="540" y="212" width="120" height="3" rx="1.5" fill="#FF7704">
        <animate attributeName="width" values="60;120;60" dur="4s" repeatCount="indefinite" />
        <animate attributeName="x" values="570;540;570" dur="4s" repeatCount="indefinite" />
      </rect>

      <text x="600" y="250" class="tagline" opacity="1">
        DESIGNER BY EYE. DEVELOPER BY CODE.
        <animate attributeName="opacity" values="1;1;0;0" dur="8s" repeatCount="indefinite" />
      </text>
      <text x="600" y="250" class="tagline" opacity="0">
        RESILIENT ARCHITECTURES. BESPOKE AESTHETICS.
        <animate attributeName="opacity" values="0;0;1;1" dur="8s" repeatCount="indefinite" />
      </text>

      <text x="600" y="292" class="keywords">Agentic AI &amp; RAG&#160;&#160;·&#160;&#160;Cryptographic Identity Systems&#160;&#160;·&#160;&#160;Pixel-Perfect UI</text>
    </g>

    <g clip-path="url(#waveClip)">
      <path fill="#FFFFFF" opacity="0.06">
        <animate attributeName="d" dur="10s" repeatCount="indefinite"
          values="M 0 345 Q 300 320 600 345 T 1200 345 L 1200 380 L 0 380 Z; M 0 360 Q 300 335 600 360 T 1200 360 L 1200 380 L 0 380 Z; M 0 345 Q 300 320 600 345 T 1200 345 L 1200 380 L 0 380 Z" />
      </path>
      <path fill="#FF7704" opacity="0.85">
        <animate attributeName="d" dur="7s" repeatCount="indefinite"
          values="M 0 365 Q 300 350 600 366 T 1200 362 L 1200 380 L 0 380 Z; M 0 372 Q 300 360 600 355 T 1200 372 L 1200 380 L 0 380 Z; M 0 365 Q 300 350 600 366 T 1200 362 L 1200 380 L 0 380 Z" />
      </path>
    </g>
  </g>
</svg>
