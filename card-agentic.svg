<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460">
  <defs>
    <linearGradient id="gBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1489CA" />
      <stop offset="55%" stop-color="#117EBA" />
      <stop offset="100%" stop-color="#0E6B9E" />
    </linearGradient>
    <linearGradient id="gBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7704"><animate attributeName="stop-color" values="#FF7704;#FFFFFF;#1489CA;#FF7704" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="50%" stop-color="#FFFFFF"><animate attributeName="stop-color" values="#FFFFFF;#FF7704;#1489CA;#FFFFFF" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="100%" stop-color="#1489CA"><animate attributeName="stop-color" values="#1489CA;#F6530F;#FF7704;#1489CA" dur="7s" repeatCount="indefinite" /></stop>
    </linearGradient>
    <filter id="gShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.22" />
    </filter>
    <clipPath id="gOuter"><rect x="0" y="0" width="920" height="460" rx="28" /></clipPath>
    <clipPath id="gCard"><rect x="30" y="30" width="860" height="400" rx="24" /></clipPath>
  </defs>

  <style>
    .g-title { font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif; font-size: 23px; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; fill: #FF7704; }
    .g-node-t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 800; fill: #0F172A; }
    .g-node-s { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11.5px; font-weight: 500; fill: #64748B; }
    .g-quote { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #FFFFFF; }
    @keyframes gPulse { 0%,100% { r: 40; } 50% { r: 43; } }
    .g-n0 { animation: gPulse 3.4s ease-in-out infinite; }
    .g-n1 { animation: gPulse 3.4s ease-in-out infinite 0.5s; }
    .g-n2 { animation: gPulse 3.4s ease-in-out infinite 1s; }
    .g-n3 { animation: gPulse 3.4s ease-in-out infinite 1.5s; }
    .g-flow { stroke-dasharray: 6 8; animation: gDash 1.4s linear infinite; }
    @keyframes gDash { to { stroke-dashoffset: -28; } }
  </style>

  <g clip-path="url(#gOuter)">
    <rect x="0" y="0" width="920" height="460" fill="url(#gBg)" />
    <rect x="3" y="3" width="914" height="454" rx="26" fill="none" stroke="url(#gBorder)" stroke-width="2.2">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="6s" repeatCount="indefinite" />
    </rect>

    <g clip-path="url(#gCard)" filter="url(#gShadow)">
      <rect x="30" y="30" width="860" height="400" rx="24" fill="#FFFFFF" />

      <g transform="translate(85, 58)" stroke="#FF7704" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3" /><circle cx="4" cy="4" r="2" /><circle cx="20" cy="4" r="2" /><circle cx="4" cy="20" r="2" /><circle cx="20" cy="20" r="2" />
        <line x1="9.6" y1="9.6" x2="5.4" y2="5.4" /><line x1="14.4" y1="9.6" x2="18.6" y2="5.4" /><line x1="9.6" y1="14.4" x2="5.4" y2="18.6" /><line x1="14.4" y1="14.4" x2="18.6" y2="18.6" />
      </g>
      <text x="118" y="90" class="g-title">Agentic AI &amp; RAG Pipeline</text>

      <!-- Connecting flow lines -->
      <g fill="none" stroke-linecap="round">
        <line x1="191" y1="220" x2="322" y2="220" stroke="#1489CA" stroke-width="3" class="g-flow" />
        <line x1="414" y1="220" x2="545" y2="220" stroke="#FF7704" stroke-width="3" class="g-flow" />
        <line x1="637" y1="220" x2="768" y2="220" stroke="#1489CA" stroke-width="3" class="g-flow" />
      </g>
      <g fill="#334155">
        <path d="M322 220 l-10 -5 v10 z" />
        <path d="M545 220 l-10 -5 v10 z" />
        <path d="M768 220 l-10 -5 v10 z" />
      </g>

      <!-- Node 1: Vector Memory -->
      <g transform="translate(145, 220)">
        <circle class="g-n0" cx="0" cy="0" r="40" fill="#EAF6FF" stroke="#1489CA" stroke-width="2.5" />
        <g transform="translate(-13,-15)" stroke="#1489CA" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <ellipse cx="13" cy="4" rx="11" ry="4" />
          <path d="M2 4v18c0 2.2 4.9 4 11 4s11-1.8 11-4V4" />
          <path d="M2 15c0 2.2 4.9 4 11 4s11-1.8 11-4" />
        </g>
        <text x="0" y="65" text-anchor="middle" class="g-node-t" textLength="120" lengthAdjust="spacingAndGlyphs">Vector Memory</text>
        <text x="0" y="83" text-anchor="middle" class="g-node-s" textLength="118" lengthAdjust="spacingAndGlyphs">ChromaDB · 768-dim</text>
      </g>

      <!-- Node 2: Agent Orchestration -->
      <g transform="translate(368, 220)">
        <circle class="g-n1" cx="0" cy="0" r="40" fill="#FFF1E7" stroke="#FF7704" stroke-width="2.5" />
        <g transform="translate(-13,-13)" stroke="#FF7704" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="13" cy="13" r="3.2" />
          <circle cx="3" cy="3" r="2.4" /><circle cx="23" cy="3" r="2.4" /><circle cx="3" cy="23" r="2.4" /><circle cx="23" cy="23" r="2.4" />
          <line x1="10.8" y1="10.8" x2="5.2" y2="5.2" /><line x1="15.2" y1="10.8" x2="20.8" y2="5.2" /><line x1="10.8" y1="15.2" x2="5.2" y2="20.8" /><line x1="15.2" y1="15.2" x2="20.8" y2="20.8" />
        </g>
        <text x="0" y="65" text-anchor="middle" class="g-node-t" textLength="150" lengthAdjust="spacingAndGlyphs">Agent Orchestration</text>
        <text x="0" y="83" text-anchor="middle" class="g-node-s" textLength="140" lengthAdjust="spacingAndGlyphs">LangGraph StateGraph</text>
      </g>

      <!-- Node 3: 5-Tier Failover -->
      <g transform="translate(591, 220)">
        <circle class="g-n2" cx="0" cy="0" r="40" fill="#EAF6FF" stroke="#1489CA" stroke-width="2.5" />
        <g transform="translate(-13,-14)" stroke="#1489CA" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="0" width="24" height="6" rx="1.5" />
          <rect x="1" y="10" width="24" height="6" rx="1.5" />
          <rect x="1" y="20" width="24" height="6" rx="1.5" />
        </g>
        <text x="0" y="65" text-anchor="middle" class="g-node-t" textLength="130" lengthAdjust="spacingAndGlyphs">5-Tier Failover</text>
        <text x="0" y="83" text-anchor="middle" class="g-node-s" textLength="150" lengthAdjust="spacingAndGlyphs">Zero-downtime routing</text>
      </g>

      <!-- Node 4: Cryptographic Output -->
      <g transform="translate(814, 220)">
        <circle class="g-n3" cx="0" cy="0" r="40" fill="#FFF1E7" stroke="#FF7704" stroke-width="2.5" />
        <g transform="translate(-11,-14)" stroke="#FF7704" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="10" width="18" height="14" rx="3" />
          <path d="M6 10V7a5 5 0 0 1 10 0v3" />
        </g>
        <text x="0" y="65" text-anchor="middle" class="g-node-t" textLength="165" lengthAdjust="spacingAndGlyphs">Cryptographic Output</text>
        <text x="0" y="83" text-anchor="middle" class="g-node-s" textLength="110" lengthAdjust="spacingAndGlyphs">JWT · OAuth2</text>
      </g>

      <rect x="30" y="340" width="860" height="70" fill="#070A12" />
      <text x="460" y="382" text-anchor="middle" class="g-quote" textLength="560" lengthAdjust="spacingAndGlyphs">Retrieval, reasoning, and failover — secured end-to-end.</text>
    </g>
  </g>
</svg>
