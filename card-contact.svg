<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E6B9E" />
      <stop offset="55%" stop-color="#117EBA" />
      <stop offset="100%" stop-color="#1489CA" />
    </linearGradient>
    <linearGradient id="cBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7704"><animate attributeName="stop-color" values="#FF7704;#FFFFFF;#1489CA;#FF7704" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="50%" stop-color="#FFFFFF"><animate attributeName="stop-color" values="#FFFFFF;#FF7704;#1489CA;#FFFFFF" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="100%" stop-color="#1489CA"><animate attributeName="stop-color" values="#1489CA;#F6530F;#FF7704;#1489CA" dur="7s" repeatCount="indefinite" /></stop>
    </linearGradient>
    <radialGradient id="cGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF7704" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF7704" stop-opacity="0" />
    </radialGradient>
    <filter id="cBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="30" /></filter>
    <clipPath id="cClip"><rect x="0" y="0" width="920" height="260" rx="28" /></clipPath>
  </defs>

  <style>
    .c-eyebrow { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12.5px; font-weight: 800; letter-spacing: 4px; fill: #FF9B4A; }
    .c-head { font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif; font-size: 30px; font-weight: 900; letter-spacing: 0.5px; fill: #FFFFFF; }
    .c-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 500; fill: #E7F3FF; }
    .c-btn { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; font-weight: 800; letter-spacing: 1.3px; fill: #FFFFFF; }
    @keyframes cDrift { 0%,100% { transform: translate(0,0); } 50% { transform: translate(0,-10px); } }
    .c-orb { animation: cDrift 7s ease-in-out infinite; }
  </style>

  <g clip-path="url(#cClip)">
    <rect x="0" y="0" width="920" height="260" fill="url(#cBg)" />
    <circle class="c-orb" cx="460" cy="40" r="180" fill="url(#cGlow)" filter="url(#cBlur)" />
    <rect x="3" y="3" width="914" height="254" rx="26" fill="none" stroke="url(#cBorder)" stroke-width="2.2">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="6s" repeatCount="indefinite" />
    </rect>

    <g text-anchor="middle">
      <text x="460" y="76" class="c-eyebrow">OPEN TO OPPORTUNITIES</text>
      <text x="460" y="118" class="c-head" textLength="620" lengthAdjust="spacingAndGlyphs">Let's make something impact-oriented.</text>
      <text x="460" y="146" class="c-sub" textLength="560" lengthAdjust="spacingAndGlyphs">Reach out about collaborations, freelance work, or just to talk architecture.</text>
    </g>

    <g transform="translate(370, 175)">
      <rect x="0" y="0" width="180" height="46" rx="23" fill="#FF7704" stroke="#FFFFFF" stroke-width="1.8">
        <animate attributeName="fill" values="#FF7704;#F6530F;#FF7704" dur="4s" repeatCount="indefinite" />
      </rect>
      <text x="90" y="29" text-anchor="middle" class="c-btn" textLength="110" lengthAdjust="spacingAndGlyphs">✉ EMAIL ME</text>
    </g>
  </g>
</svg>
