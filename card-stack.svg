    .s-tile-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 800; fill: #0F172A; }
    .s-quote { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #FFFFFF; }
    @keyframes sFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .s-tile-0 { animation: sFloat 4.2s ease-in-out infinite; }
    .s-tile-1 { animation: sFloat 4.2s ease-in-out infinite 0.4s; }
    .s-tile-2 { animation: sFloat 4.2s ease-in-out infinite 0.8s; }
    .s-tile-3 { animation: sFloat 4.2s ease-in-out infinite 1.2s; }
