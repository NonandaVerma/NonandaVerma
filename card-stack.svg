<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="430">
  <defs>
    <filter id="stackShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <clipPath id="stackClip">
      <rect x="0" y="0" width="880" height="430" rx="24" />
    </clipPath>
  </defs>

  <style>
    .card-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif;
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 1px;
      text-transform: uppercase;
      fill: #FF7704;
    }
    .quad-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      fill: #0F172A;
    }
    .quad-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12.5px;
      font-style: italic;
      fill: #64748B;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      fill: #FFFFFF;
    }
    .quote-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 14.5px;
      font-weight: 600;
      fill: #FFFFFF;
    }
  </style>

  <g clip-path="url(#stackClip)">
    <rect x="0" y="0" width="880" height="430" rx="24" fill="#FFFFFF" filter="url(#stackShadow)" />

    <!-- Card Header -->
    <g transform="translate(45, 34)">
      <g transform="translate(0, 3)" stroke="#FF7704" stroke-width="2.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
      </g>
      <text x="44" y="24" class="card-title">PRODUCTION ARCHITECTURE &amp; STACK</text>
    </g>

    <!-- Quadrant 1 -->
    <g transform="translate(45, 95)">
      <text x="0" y="16" class="quad-title">⚡ Frontend &amp; Edge Delivery</text>
      <text x="0" y="34" class="quad-sub">Pixel-perfect, accessible, 60fps edge rendering</text>
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="94" height="26" rx="13" fill="#070A12" /><text x="47" y="17" text-anchor="middle" class="badge-text">Next.js 16</text>
        <rect x="100" y="0" width="84" height="26" rx="13" fill="#1489CA" /><text x="142" y="17" text-anchor="middle" class="badge-text">React 19</text>
        <rect x="190" y="0" width="88" height="26" rx="13" fill="#D97706" /><text x="234" y="17" text-anchor="middle" class="badge-text">JavaScript</text>
        <rect x="284" y="0" width="96" height="26" rx="13" fill="#0284C7" /><text x="332" y="17" text-anchor="middle" class="badge-text">Tailwind v4</text>
      </g>
    </g>

    <!-- Quadrant 2 -->
    <g transform="translate(480, 95)">
      <text x="0" y="16" class="quad-title">⚙️ Backend, Systems &amp; APIs</text>
      <text x="0" y="34" class="quad-sub">Distributed microservices &amp; cryptographic security</text>
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="118" height="26" rx="13" fill="#059669" /><text x="59" y="17" text-anchor="middle" class="badge-text">Python FastAPI</text>
        <rect x="124" y="0" width="76" height="26" rx="13" fill="#16A34A" /><text x="162" y="17" text-anchor="middle" class="badge-text">Node.js</text>
        <rect x="206" y="0" width="78" height="26" rx="13" fill="#070A12" /><text x="245" y="17" text-anchor="middle" class="badge-text">ColdBox</text>
        <rect x="290" y="0" width="78" height="26" rx="13" fill="#EA580C" /><text x="329" y="17" text-anchor="middle" class="badge-text">OAuth2</text>
      </g>
    </g>

    <!-- Quadrant 3 -->
    <g transform="translate(45, 230)">
      <text x="0" y="16" class="quad-title">🤖 Agentic AI &amp; Vector Intelligence</text>
      <text x="0" y="34" class="quad-sub">Multi-agent graphs, persistent memory &amp; LLM failover</text>
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="94" height="26" rx="13" fill="#FF7704" /><text x="47" y="17" text-anchor="middle" class="badge-text">LangGraph</text>
        <rect x="100" y="0" width="94" height="26" rx="13" fill="#DC2626" /><text x="147" y="17" text-anchor="middle" class="badge-text">ChromaDB</text>
        <rect x="200" y="0" width="96" height="26" rx="13" fill="#4D7C0F" /><text x="248" y="17" text-anchor="middle" class="badge-text">NVIDIA NIM</text>
        <rect x="302" y="0" width="68" height="26" rx="13" fill="#070A12" /><text x="336" y="17" text-anchor="middle" class="badge-text">Ollama</text>
      </g>
    </g>

    <!-- Quadrant 4 -->
    <g transform="translate(480, 230)">
      <text x="0" y="16" class="quad-title">☁️ Cloud, DevOps &amp; UI Systems</text>
      <text x="0" y="34" class="quad-sub">Containers, edge infrastructure &amp; brand design</text>
      <g transform="translate(0, 48)">
        <rect x="0" y="0" width="74" height="26" rx="13" fill="#0284C7" /><text x="37" y="17" text-anchor="middle" class="badge-text">Docker</text>
        <rect x="80" y="0" width="86" height="26" rx="13" fill="#15803D" /><text x="123" y="17" text-anchor="middle" class="badge-text">MongoDB</text>
        <rect x="172" y="0" width="94" height="26" rx="13" fill="#070A12" /><text x="219" y="17" text-anchor="middle" class="badge-text">Vercel Edge</text>
        <rect x="272" y="0" width="94" height="26" rx="13" fill="#0A5B9E" /><text x="319" y="17" text-anchor="middle" class="badge-text">UI Systems</text>
      </g>
    </g>

    <!-- Bottom Callout Bar in Blue -->
    <g transform="translate(0, 370)">
      <rect x="0" y="0" width="880" height="60" fill="#1489CA" />
      <text x="50%" y="36" text-anchor="middle" class="quote-text">Production-hardened architectures paired with pixel-perfect visual discipline.</text>
    </g>
  </g>
</svg>
