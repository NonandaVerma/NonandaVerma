  <style>
    .f-sig { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; font-style: italic; fill: #FFFFFF; }
  </style>

  <g clip-path="url(#fOuter)">
