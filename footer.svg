<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220">
  <defs>
    <linearGradient id="fBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1489CA" />
      <stop offset="55%" stop-color="#117EBA" />
      <stop offset="100%" stop-color="#0E6B9E" />
    </linearGradient>
    <linearGradient id="fBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7704"><animate attributeName="stop-color" values="#FF7704;#FFFFFF;#1489CA;#FF7704" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="50%" stop-color="#FFFFFF"><animate attributeName="stop-color" values="#FFFFFF;#FF7704;#1489CA;#FFFFFF" dur="7s" repeatCount="indefinite" /></stop>
      <stop offset="100%" stop-color="#1489CA"><animate attributeName="stop-color" values="#1489CA;#F6530F;#FF7704;#1489CA" dur="7s" repeatCount="indefinite" /></stop>
    </linearGradient>
    <clipPath id="fOuter"><rect x="0" y="0" width="920" height="220" rx="28" /></clipPath>
    <clipPath id="fWave"><rect x="0" y="140" width="920" height="80" /></clipPath>
  </defs>

  <style>
    .f-sig { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13.5px; font-weight: 600; font-style: italic; fill: #FFFFFF; }
    .f-in { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 18px; font-weight: 800; fill: #FFFFFF; }
    @keyframes fBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    .f-icon-0 { animation: fBob 4s ease-in-out infinite; }
    .f-icon-1 { animation: fBob 4s ease-in-out infinite 0.3s; }
    .f-icon-2 { animation: fBob 4s ease-in-out infinite 0.6s; }
  </style>

  <g clip-path="url(#fOuter)">
    <rect x="0" y="0" width="920" height="220" fill="url(#fBg)" />
    <rect x="3" y="3" width="914" height="214" rx="26" fill="none" stroke="url(#fBorder)" stroke-width="2.2">
      <animate attributeName="stroke-opacity" values="0.55;1;0.55" dur="6s" repeatCount="indefinite" />
    </rect>

    <!-- LinkedIn -->
    <g class="f-icon-0" transform="translate(386, 55)">
      <circle r="22" fill="#0A5B9E" stroke="#FFFFFF" stroke-width="1.6" />
      <text x="0" y="6.5" text-anchor="middle" class="f-in">in</text>
    </g>

    <!-- Portfolio / Globe -->
    <g class="f-icon-1" transform="translate(460, 55)">
      <circle r="22" fill="#FF7704" stroke="#FFFFFF" stroke-width="1.6">
        <animate attributeName="fill" values="#FF7704;#F6530F;#FF7704" dur="4s" repeatCount="indefinite" />
      </circle>
      <g stroke="#FFFFFF" stroke-width="1.6" fill="none">
        <circle r="11" />
        <ellipse rx="5" ry="11" />
        <line x1="-11" y1="0" x2="11" y2="0" />
      </g>
    </g>

    <!-- Email -->
    <g class="f-icon-2" transform="translate(534, 55)">
      <circle r="22" fill="#070A12" stroke="#FFFFFF" stroke-width="1.6" />
      <g transform="translate(-11,-9) scale(0.9)" fill="#FFFFFF">
        <path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z"/>
      </g>
    </g>

    <text x="460" y="100" text-anchor="middle" class="f-sig" textLength="615" lengthAdjust="spacingAndGlyphs">Crafted with intentional design aesthetics and resilient code by Nonanda Verma.</text>

    <g clip-path="url(#fWave)">
      <path fill="#FFFFFF" opacity="0.95">
        <animate attributeName="d" dur="8s" repeatCount="indefinite"
          values="M 0 180 Q 230 215 460 180 T 920 180 L 920 220 L 0 220 Z; M 0 195 Q 230 160 460 195 T 920 195 L 920 220 L 0 220 Z; M 0 180 Q 230 215 460 180 T 920 180 L 920 220 L 0 220 Z" />
      </path>
      <path fill="#070A12" opacity="0.95">
        <animate attributeName="d" dur="6s" repeatCount="indefinite"
          values="M 0 192 Q 230 170 460 198 T 920 192 L 920 220 L 0 220 Z; M 0 205 Q 230 218 460 188 T 920 205 L 920 220 L 0 220 Z; M 0 192 Q 230 170 460 198 T 920 192 L 920 220 L 0 220 Z" />
      </path>
      <path fill="#FF7704">
        <animate attributeName="d" dur="5s" repeatCount="indefinite"
          values="M 0 206 Q 230 220 460 206 T 920 212 L 920 220 L 0 220 Z; M 0 214 Q 230 198 460 218 T 920 208 L 920 220 L 0 220 Z; M 0 206 Q 230 220 460 206 T 920 212 L 920 220 L 0 220 Z" />
      </path>
    </g>
  </g>
</svg>
