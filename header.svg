<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 180" width="100%" height="180">
  <defs>
    <linearGradient id="headerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1489CA" />
      <stop offset="100%" stop-color="#0E73AC" />
    </linearGradient>
    <clipPath id="avatarCircle">
      <circle cx="75" cy="90" r="48" />
    </clipPath>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Montserrat', 'Segoe UI', Roboto, sans-serif;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      fill: #FFFFFF;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      fill: rgba(255, 255, 255, 0.95);
    }
    @keyframes subtlePulse {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }
    .divider-line {
      animation: subtlePulse 3s ease-in-out infinite;
    }
  </style>

  <rect x="0" y="0" width="880" height="180" rx="16" fill="url(#headerBg)" />
  <rect x="0" y="0" width="880" height="180" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />

  <!-- Avatar & Circular White Frame -->
  <g>
    <circle cx="75" cy="90" r="50" fill="#070A12" stroke="#FFFFFF" stroke-width="3.5" />
    <image href="https://github.com/NonandaVerma.png" x="27" y="42" width="96" height="96" clip-path="url(#avatarCircle)" preserveAspectRatio="xMidYMid slice" />
  </g>

  <!-- Typography -->
  <text x="145" y="80" class="title-text">NONANDA VERMA</text>
  <text x="146" y="112" class="subtitle-text">DESIGNER BY EYE. DEVELOPER BY CODE.</text>
  <line x1="146" y1="128" x2="835" y2="128" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.8" class="divider-line" />
</svg>
